name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Install with lifecycle scripts disabled, then run Electron's installer
      # by hand.
      #
      # Why: better-sqlite3@13 ships a binding.gyp, and npm responds by
      # shelling out to `node-gyp rebuild`. But that version already bundles
      # working N-API binaries under prebuilds/ and loads them at runtime — no
      # compilation is required. The compile only ever fails, because the
      # hosted runner ships Visual Studio 18, which node-gyp 9.4.1 cannot
      # detect ("could not find a version of Visual Studio 2017 or newer").
      # Skipping scripts also avoids rebuilding sharp/esbuild, which we don't
      # need here, and makes the install dramatically faster.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Electron's postinstall is the one script we actually need: it fetches
      # the Electron binary, which the rest of the build depends on.
      - name: Download Electron binary
        run: node node_modules/electron/install.js

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build