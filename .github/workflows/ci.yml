name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No electron-rebuild here on purpose: the unit tests run under Node, so
      # they use the prebuilt better-sqlite3 binary npm already ships. Only the
      # running Electron app needs the Electron-ABI rebuild, and that happens in
      # `npm run package`.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build